<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="dr-title dr-desc">
  <title id="dr-title">Two routes to the same bridge</title>
  <desc id="dr-desc">Interactive: agy loads the plugin's mcp_config.json and the conductor calls the model-dispatch bridge's tools directly through call_mcp_tool. Headless: agy -p loads no plugin, so run.mjs renders a conductor prompt that shells out to dispatch.mjs, which speaks MCP to the same bridge. Both reach the same five tools, the same policy, the same adapters and the same telemetry.jsonl.</desc>

  <defs>
    <marker id="dr-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
    <style>
      .tag  { font: 700 10px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #6B7280; letter-spacing: 0.10em; }
      .h    { font: 700 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #111827; }
      .b    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1F2937; }
      .s    { font: 400 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4B5563; }
      .mono { font: 500 11.5px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #1F2937; }
      .edge { font: 500 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #6B7280; }
      @media (prefers-color-scheme: dark) {
        .tag  { fill: #9CA3AF; }
        .h    { fill: #F9FAFB; }
        .b    { fill: #E5E7EB; }
        .s    { fill: #D1D5DB; }
        .mono { fill: #E5E7EB; }
        .edge { fill: #9CA3AF; }
      }
    </style>
  </defs>

  <rect width="1000" height="420" fill="none"/>

  <text x="60"  y="42" class="tag">ROUTE A — INTERACTIVE SESSION</text>
  <text x="60"  y="252" class="tag">ROUTE B — HEADLESS (run.mjs)</text>
  <text x="640" y="42" class="tag">ONE BRIDGE, ONE CONTRACT</text>

  <!-- Route A -->
  <g>
    <rect x="60" y="60" width="200" height="130" rx="10" fill="#EFF2FA" stroke="#375A9D" stroke-width="1.5"/>
    <text x="160" y="88"  text-anchor="middle" class="h">agy, trusted workspace</text>
    <text x="160" y="108" text-anchor="middle" class="s">loads .agents/plugins/mmo/</text>
    <text x="160" y="124" text-anchor="middle" class="s">skills · rules · hooks · MCP</text>
    <rect x="78" y="140" width="164" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="160" y="156" text-anchor="middle" class="mono">/mmo:greenfield</text>
    <text x="160" y="170" text-anchor="middle" class="mono">/mmo:brownfield</text>
  </g>

  <path d="M 265 125 L 335 125" stroke="#6B7280" stroke-width="1.5" fill="none" marker-end="url(#dr-arr)"/>

  <g>
    <rect x="340" y="60" width="240" height="130" rx="10" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.5"/>
    <text x="460" y="88"  text-anchor="middle" class="h" style="fill:#3B0764">Gemini 3.8 Flash conducts</text>
    <text x="460" y="108" text-anchor="middle" class="s" style="fill:#4C1D95">calls the bridge's tools directly</text>
    <rect x="358" y="120" width="204" height="56" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="460" y="138" text-anchor="middle" class="mono">call_mcp_tool</text>
    <text x="460" y="153" text-anchor="middle" class="mono">server: mmo_model-dispatch</text>
    <text x="460" y="168" text-anchor="middle" class="mono">tool: execute_with_model</text>
  </g>

  <path d="M 585 125 L 635 125" stroke="#6B7280" stroke-width="1.5" fill="none" marker-end="url(#dr-arr)"/>
  <text x="610" y="115" text-anchor="middle" class="edge">stdio</text>

  <!-- Route B -->
  <g>
    <rect x="60" y="270" width="200" height="130" rx="10" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="160" y="298" text-anchor="middle" class="h">plugin/agy/run.mjs</text>
    <text x="160" y="318" text-anchor="middle" class="s">pins the model and effort</text>
    <text x="160" y="334" text-anchor="middle" class="s">renders conductor.md</text>
    <rect x="78" y="348" width="164" height="38" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="160" y="364" text-anchor="middle" class="mono">agy --print …</text>
    <text x="160" y="379" text-anchor="middle" class="mono">--output-format stream-json</text>
  </g>

  <path d="M 265 335 L 335 335" stroke="#6B7280" stroke-width="1.5" fill="none" marker-end="url(#dr-arr)"/>
  <text x="300" y="325" text-anchor="middle" class="edge">no plugin loads</text>

  <g>
    <rect x="340" y="270" width="240" height="130" rx="10" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.5"/>
    <text x="460" y="298" text-anchor="middle" class="h" style="fill:#3B0764">Gemini 3.8 Flash conducts</text>
    <text x="460" y="318" text-anchor="middle" class="s" style="fill:#4C1D95">shells out to the dispatch script</text>
    <rect x="358" y="330" width="204" height="56" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="460" y="348" text-anchor="middle" class="mono">node plugin/agy/dispatch.mjs</text>
    <text x="460" y="363" text-anchor="middle" class="mono">--packet=… --out=…</text>
    <text x="460" y="378" text-anchor="middle" class="mono">speaks MCP via driverClient.ts</text>
  </g>

  <path d="M 585 335 L 635 335" stroke="#6B7280" stroke-width="1.5" fill="none" marker-end="url(#dr-arr)"/>
  <text x="610" y="325" text-anchor="middle" class="edge">stdio</text>

  <!-- Bridge -->
  <g>
    <rect x="640" y="60" width="300" height="340" rx="10" fill="#EFF2FA" stroke="#375A9D" stroke-width="2"/>
    <text x="790" y="90"  text-anchor="middle" class="h">model-dispatch bridge</text>
    <text x="790" y="110" text-anchor="middle" class="s">the same server, whoever opened the socket</text>

    <rect x="658" y="126" width="264" height="74" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="790" y="144" text-anchor="middle" class="b">five tools</text>
    <text x="790" y="161" text-anchor="middle" class="mono">preflight_dispatch · load_policy</text>
    <text x="790" y="176" text-anchor="middle" class="mono">execute_with_model · log_telemetry</text>
    <text x="790" y="191" text-anchor="middle" class="mono">simulate_policy</text>

    <text x="790" y="222" text-anchor="middle" class="s">policy rules → adapter → model</text>

    <rect x="658" y="236" width="124" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
    <text x="720" y="258" text-anchor="middle" class="b" style="fill:#78350F">claude-agent-sdk</text>
    <text x="720" y="275" text-anchor="middle" class="s" style="fill:#78350F">Claude Agent SDK</text>
    <text x="720" y="291" text-anchor="middle" class="s" style="fill:#78350F">Opus 5 · judgment</text>

    <rect x="798" y="236" width="124" height="70" rx="8" fill="#E0F2FE" stroke="#0369A1" stroke-width="1.5"/>
    <text x="860" y="258" text-anchor="middle" class="b" style="fill:#0C4A6E">flash-completion</text>
    <text x="860" y="275" text-anchor="middle" class="s" style="fill:#0C4A6E">or agsdk worker</text>
    <text x="860" y="291" text-anchor="middle" class="s" style="fill:#0C4A6E">Flash · mechanical</text>

    <rect x="658" y="322" width="264" height="62" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <text x="790" y="342" text-anchor="middle" class="b" style="fill:#065F46">telemetry.jsonl</text>
    <text x="790" y="359" text-anchor="middle" class="s" style="fill:#047857">one line per dispatch, vendor-metered</text>
    <text x="790" y="375" text-anchor="middle" class="s" style="fill:#047857">priced from the dated list at dispatch time</text>
  </g>
</svg>
